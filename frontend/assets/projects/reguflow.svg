<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E3A"/>
      <stop offset="50%" stop-color="#0F2D54"/>
      <stop offset="100%" stop-color="#0A1C33"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#rf-bg)" rx="16"/>

  <!-- Top Title -->
  <rect x="40" y="24" width="370" height="34" rx="17" fill="#153660" stroke="#2563EB" stroke-width="1"/>
  <circle cx="58" cy="41" r="5" fill="#60A5FA"/>
  <text x="72" y="46" fill="#F8FAFC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">REGUFLOW — AICTE WORKFLOW AUTOMATION</text>

  <rect x="580" y="24" width="180" height="34" rx="17" fill="#153660" stroke="#60A5FA" stroke-width="1"/>
  <text x="670" y="46" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="12">Next.js &bull; FastAPI &bull; OCR</text>

  <!-- 3 Major Modules Architecture -->
  <!-- Module 1: Institutional Intake & OCR -->
  <g transform="translate(45, 95)">
    <rect width="210" height="250" rx="10" fill="#0C2548" stroke="#1D4ED8" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#1E40AF"/>
    <text x="35" y="41" text-anchor="middle" fill="#DBEAFE" font-size="18">📄</text>
    <text x="65" y="32" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Document Intake</text>
    <text x="65" y="48" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10">OCR Intelligence</text>

    <g transform="translate(15, 75)">
      <rect width="180" height="36" rx="4" fill="#1E3A8A"/>
      <text x="12" y="22" fill="#E0F2FE" font-family="'Inter', sans-serif" font-size="10">Land &amp; Building Titles</text>
      <text x="165" y="22" text-anchor="end" fill="#34D399" font-family="'Inter', sans-serif" font-size="11">✓</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="180" height="36" rx="4" fill="#1E3A8A"/>
      <text x="12" y="22" fill="#E0F2FE" font-family="'Inter', sans-serif" font-size="10">Faculty Cadre Ratios</text>
      <text x="165" y="22" text-anchor="end" fill="#34D399" font-family="'Inter', sans-serif" font-size="11">✓</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="180" height="36" rx="4" fill="#1E3A8A"/>
      <text x="12" y="22" fill="#E0F2FE" font-family="'Inter', sans-serif" font-size="10">Lab Equipment Norms</text>
      <text x="165" y="22" text-anchor="end" fill="#34D399" font-family="'Inter', sans-serif" font-size="11">✓</text>
    </g>

    <rect x="15" y="210" width="180" height="24" rx="4" fill="#172554"/>
    <text x="105" y="226" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="9">Tesseract OCR &bull; Layout LM</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 260 220 L 290 220" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <!-- Module 2: Rule Engine & Norms Validation -->
  <g transform="translate(295, 95)">
    <rect width="210" height="250" rx="10" fill="#0C2548" stroke="#3B82F6" stroke-width="2"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#1D4ED8"/>
    <text x="35" y="41" text-anchor="middle" fill="#DBEAFE" font-size="18">⚖️</text>
    <text x="65" y="32" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Compliance Core</text>
    <text x="65" y="48" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10">AICTE Handbook Norms</text>

    <!-- Calculation stats -->
    <rect x="15" y="70" width="180" height="75" rx="6" fill="#1E3A8A"/>
    <text x="25" y="92" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10">Audit Compliance Score</text>
    <text x="25" y="125" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700">96.4%</text>
    <text x="120" y="125" fill="#DBEAFE" font-family="'Inter', sans-serif" font-size="10">Passing Norms</text>

    <rect x="15" y="155" width="180" height="42" rx="6" fill="#172554" stroke="#60A5FA"/>
    <text x="25" y="172" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="9">Deficiency Alert Engine</text>
    <text x="25" y="188" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10">0 Major &bull; 1 Advisory</text>

    <rect x="15" y="210" width="180" height="24" rx="4" fill="#172554"/>
    <text x="105" y="226" text-anchor="middle" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="9">Dynamic JSON Rule Parser</text>
  </g>

  <!-- Flow Arrow -->
  <path d="M 510 220 L 540 220" fill="none" stroke="#3B82F6" stroke-width="3"/>

  <!-- Module 3: Scrutiny Dashboard & Role-based Access -->
  <g transform="translate(545, 95)">
    <rect width="210" height="250" rx="10" fill="#0C2548" stroke="#1D4ED8" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="6" fill="#1E40AF"/>
    <text x="35" y="41" text-anchor="middle" fill="#DBEAFE" font-size="18">📊</text>
    <text x="65" y="32" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Scrutiny Portal</text>
    <text x="65" y="48" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="10">Role-Based Access</text>

    <g transform="translate(15, 70)">
      <rect width="180" height="40" rx="4" fill="#1E3A8A"/>
      <text x="15" y="24" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Institutional Admin</text>
      <circle cx="160" cy="20" r="5" fill="#34D399"/>
    </g>

    <g transform="translate(15, 118)">
      <rect width="180" height="40" rx="4" fill="#1E3A8A"/>
      <text x="15" y="24" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Regional Officer (RO)</text>
      <circle cx="160" cy="20" r="5" fill="#60A5FA"/>
    </g>

    <g transform="translate(15, 166)">
      <rect width="180" height="40" rx="4" fill="#1E3A8A"/>
      <text x="15" y="24" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Scrutiny Committee</text>
      <circle cx="160" cy="20" r="5" fill="#A78BFA"/>
    </g>

    <rect x="15" y="214" width="180" height="24" rx="4" fill="#172554"/>
    <text x="105" y="230" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="9">Real-time Deadline Alerts</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(45, 370)">
    <rect width="710" height="50" rx="8" fill="#0A182E" stroke="#1D4ED8" stroke-width="1"/>
    <text x="355" y="24" text-anchor="middle" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">
      Next.js Responsive UI &bull; PostgreSQL Normalized Schema &bull; Automated Document Verification &bull; AICTE Norms Alignment
    </text>
    <text x="355" y="42" text-anchor="middle" fill="#93C5FD" font-family="'Inter', sans-serif" font-size="11">
      Eliminating manual compliance friction for higher education accreditation and renewals.
    </text>
  </g>
</svg>
