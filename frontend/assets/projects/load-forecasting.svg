<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#111B35"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
    <linearGradient id="actual-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pred-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-1)" rx="16"/>

  <!-- Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="140" x2="720" y2="140"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="260" x2="720" y2="260"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
    <line x1="160" y1="60" x2="160" y2="340"/>
    <line x1="280" y1="60" x2="280" y2="340"/>
    <line x1="400" y1="60" x2="400" y2="340"/>
    <line x1="520" y1="60" x2="520" y2="340"/>
    <line x1="640" y1="60" x2="640" y2="340"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="30" width="310" height="34" rx="17" fill="#151D2E" stroke="#334155" stroke-width="1"/>
  <circle cx="68" cy="47" r="5" fill="#22D3EE"/>
  <text x="82" y="52" fill="#F8FAFC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">TIME-SERIES LOAD DEMAND FORECAST</text>

  <!-- Tech Pill Tag -->
  <rect x="560" y="30" width="190" height="34" rx="17" fill="#151D2E" stroke="#60A5FA" stroke-width="1"/>
  <text x="655" y="52" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500">Random Forest Regressor</text>

  <!-- Area under predicted curve -->
  <path d="M 100 290 Q 180 270, 240 210 T 360 170 T 460 230 T 560 140 T 660 180 L 700 230 L 700 320 L 100 320 Z" fill="url(#actual-grad)" opacity="0.3"/>

  <!-- Actual Load Line (Dashed Slate) -->
  <path d="M 100 295 Q 180 275, 240 218 T 360 176 T 460 234 T 560 146 T 660 184 L 700 236" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.75"/>

  <!-- Predicted Load Line (Solid Cyan Glow) -->
  <path d="M 100 290 Q 180 270, 240 210 T 360 170 T 460 230 T 560 140 T 660 180 L 700 230" fill="none" stroke="url(#pred-grad)" stroke-width="3.5" filter="url(#glow-1)"/>

  <!-- Peak Data Points -->
  <circle cx="560" cy="140" r="6" fill="#22D3EE" stroke="#0B132B" stroke-width="2"/>
  <circle cx="360" cy="170" r="5" fill="#38BDF8" stroke="#0B132B" stroke-width="2"/>

  <!-- Annotation Card for Peak Demand -->
  <rect x="510" y="85" width="155" height="42" rx="8" fill="#1E293B" stroke="#22D3EE" stroke-width="1"/>
  <text x="520" y="102" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Evening Peak Load</text>
  <text x="520" y="119" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">184.2 GW (Est.)</text>

  <!-- Bottom Indicators & Features Bar -->
  <g transform="translate(60, 360)">
    <rect width="680" height="60" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    
    <text x="24" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Engineered Features:</text>
    <rect x="135" y="14" width="75" height="22" rx="4" fill="#1E293B"/>
    <text x="172" y="29" text-anchor="middle" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="10">Hour [0-23]</text>

    <rect x="220" y="14" width="90" height="22" rx="4" fill="#1E293B"/>
    <text x="265" y="29" text-anchor="middle" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10">Day / Weekday</text>

    <rect x="320" y="14" width="85" height="22" rx="4" fill="#1E293B"/>
    <text x="362" y="29" text-anchor="middle" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10">Month / Season</text>

    <rect x="415" y="14" width="85" height="22" rx="4" fill="#1E293B"/>
    <text x="457" y="29" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">Lag Demands</text>

    <!-- Legend -->
    <line x1="535" y1="25" x2="560" y2="25" stroke="url(#pred-grad)" stroke-width="3"/>
    <text x="568" y="29" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11">Predicted</text>
    <line x1="625" y1="25" x2="650" y2="25" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="658" y="29" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Actual</text>
  </g>
</svg>
