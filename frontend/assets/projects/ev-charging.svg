<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A23"/>
      <stop offset="50%" stop-color="#0B2B38"/>
      <stop offset="100%" stop-color="#081820"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="peak-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#ev-bg)" rx="16"/>

  <!-- Top Title -->
  <rect x="40" y="24" width="340" height="34" rx="17" fill="#0E3746" stroke="#164E63" stroke-width="1"/>
  <circle cx="58" cy="41" r="5" fill="#10B981"/>
  <text x="72" y="46" fill="#F8FAFC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">EV CHARGING DEMAND &amp; LOAD FORECAST</text>

  <rect x="580" y="24" width="180" height="34" rx="17" fill="#0E3746" stroke="#22D3EE" stroke-width="1"/>
  <text x="670" y="46" text-anchor="middle" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="12">XGBoost &bull; Analytics</text>

  <!-- Left: Station Metrics -->
  <g transform="translate(50, 90)">
    <rect width="210" height="75" rx="8" fill="#0D2E3D" stroke="#155E75" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Peak Charging Window</text>
    <text x="16" y="52" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">17:00 – 21:30</text>
    <text x="16" y="66" fill="#34D399" font-family="'Inter', sans-serif" font-size="9">Commuter Return Surge</text>
  </g>

  <g transform="translate(50, 180)">
    <rect width="210" height="75" rx="8" fill="#0D2E3D" stroke="#155E75" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Average Session Dwell</text>
    <text x="16" y="52" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">42.5 Mins</text>
    <text x="16" y="66" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">50kW DC Fast Chargers</text>
  </g>

  <g transform="translate(50, 270)">
    <rect width="210" height="85" rx="8" fill="#0D2E3D" stroke="#155E75" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Model Optimization</text>
    <text x="16" y="48" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Gradient Boost Regressor</text>
    <rect x="16" y="58" width="80" height="18" rx="4" fill="#0E3746"/>
    <text x="56" y="71" text-anchor="middle" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="9">R² = 0.932</text>
    <rect x="105" y="58" width="90" height="18" rx="4" fill="#0E3746"/>
    <text x="150" y="71" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9">RMSE: 4.8 kW</text>
  </g>

  <!-- Right: 24h Hourly Demand Histogram Chart -->
  <g transform="translate(290, 85)">
    <rect width="460" height="270" rx="12" fill="#0B222D" stroke="#164E63" stroke-width="1"/>
    <text x="24" y="32" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600">Hourly Aggregate Demand Profile (kW)</text>
    
    <!-- Chart Grid -->
    <line x1="40" y1="220" x2="430" y2="220" stroke="#1E3A4A" stroke-width="1.5"/>
    <line x1="40" y1="160" x2="430" y2="160" stroke="#1E3A4A" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="100" x2="430" y2="100" stroke="#1E3A4A" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Bars for 24h intervals -->
    <!-- 00-04h -->
    <rect x="55" y="195" width="22" height="25" rx="3" fill="url(#bar-grad)"/>
    <rect x="85" y="202" width="22" height="18" rx="3" fill="url(#bar-grad)"/>
    <!-- 06-08h morning rise -->
    <rect x="115" y="175" width="22" height="45" rx="3" fill="url(#bar-grad)"/>
    <rect x="145" y="145" width="22" height="75" rx="3" fill="url(#bar-grad)"/>
    <!-- 10-14h day charging -->
    <rect x="175" y="130" width="22" height="90" rx="3" fill="url(#bar-grad)"/>
    <rect x="205" y="135" width="22" height="85" rx="3" fill="url(#bar-grad)"/>
    <rect x="235" y="125" width="22" height="95" rx="3" fill="url(#bar-grad)"/>
    <rect x="265" y="115" width="22" height="105" rx="3" fill="url(#bar-grad)"/>
    <!-- 17-21h PEAK -->
    <rect x="295" y="80" width="22" height="140" rx="3" fill="url(#peak-grad)"/>
    <rect x="325" y="65" width="22" height="155" rx="3" fill="url(#peak-grad)"/>
    <rect x="355" y="70" width="22" height="150" rx="3" fill="url(#peak-grad)"/>
    <!-- 22h+ night decline -->
    <rect x="385" y="150" width="22" height="70" rx="3" fill="url(#bar-grad)"/>

    <!-- Labels -->
    <text x="66" y="240" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">02h</text>
    <text x="156" y="240" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">08h</text>
    <text x="246" y="240" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">14h</text>
    <text x="336" y="240" text-anchor="middle" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">19h [PEAK]</text>
    <text x="396" y="240" text-anchor="middle" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">23h</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(50, 385)">
    <rect width="700" height="42" rx="8" fill="#081820" stroke="#164E63" stroke-width="1"/>
    <text x="350" y="26" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">
      Temporal Clustering &bull; Time-of-Use Dynamic Tariff Optimization &bull; Grid Feeder Load Mitigation
    </text>
  </g>
</svg>
