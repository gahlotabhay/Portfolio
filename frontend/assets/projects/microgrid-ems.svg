<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="50%" stop-color="#101F42"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-2)" rx="16"/>

  <!-- Top Header Banner -->
  <rect x="40" y="24" width="360" height="34" rx="17" fill="#152238" stroke="#334E68" stroke-width="1"/>
  <circle cx="58" cy="41" r="5" fill="#F59E0B"/>
  <text x="72" y="46" fill="#F8FAFC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="600">MICROGRID ARCHITECTURE &amp; ISLANDING</text>

  <rect x="580" y="24" width="180" height="34" rx="17" fill="#152238" stroke="#38BDF8" stroke-width="1"/>
  <text x="670" y="46" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12">MATLAB Simulink</text>

  <!-- Block 1: Solar PV + MPPT -->
  <g transform="translate(60, 100)">
    <rect width="160" height="110" rx="10" fill="#1B2A4A" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#F59E0B" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="13">☀️</text>
    <text x="48" y="34" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">Solar PV Array</text>
    <text x="20" y="62" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Capacity: 100 kWp</text>
    <text x="20" y="82" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Algorithm: P&amp;O MPPT</text>
    <rect x="20" y="92" width="75" height="12" rx="3" fill="#2E3C5D"/>
    <text x="57" y="101" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="8">DC BUS: 600V</text>
  </g>

  <!-- Block 2: Battery Storage (BESS) -->
  <g transform="translate(60, 250)">
    <rect width="160" height="110" rx="10" fill="#1B2A4A" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="28" cy="30" r="12" fill="#10B981" opacity="0.2"/>
    <text x="28" y="34" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-size="13">🔋</text>
    <text x="48" y="34" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">BESS Storage</text>
    <text x="20" y="62" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Li-Ion: 150 kWh</text>
    <text x="20" y="82" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Bi-directional DC-DC</text>
    <rect x="20" y="92" width="85" height="12" rx="3" fill="#2E3C5D"/>
    <text x="62" y="101" text-anchor="middle" fill="#10B981" font-family="'Inter', sans-serif" font-size="8">SOC Controller</text>
  </g>

  <!-- Connecting Bus DC lines -->
  <path d="M 220 155 L 290 155 L 290 230" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6 3"/>
  <path d="M 220 305 L 290 305 L 290 230" fill="none" stroke="#10B981" stroke-width="3" stroke-dasharray="6 3"/>

  <!-- Block 3: Central Inverter (DC to AC) -->
  <g transform="translate(290, 180)">
    <rect width="140" height="100" rx="10" fill="#162A45" stroke="#38BDF8" stroke-width="2"/>
    <text x="70" y="32" text-anchor="middle" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">3-Phase Inverter</text>
    <text x="70" y="52" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">DC to AC (415V)</text>
    <text x="70" y="70" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">SPWM Switching</text>
    <line x1="20" y1="82" x2="120" y2="82" stroke="#334E68" stroke-width="1"/>
    <text x="70" y="93" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="9">50 Hz Synchronized</text>
  </g>

  <!-- AC Bus line -->
  <path d="M 430 230 L 510 230" fill="none" stroke="#38BDF8" stroke-width="4"/>

  <!-- Block 4: PCC & Islanding Detection Relays -->
  <g transform="translate(510, 155)">
    <rect width="130" height="150" rx="10" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2" filter="url(#glow-cyan)"/>
    <text x="65" y="28" text-anchor="middle" fill="#C4B5FD" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">IEEE 1547</text>
    <text x="65" y="44" text-anchor="middle" fill="#A78BFA" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Islanding Logic</text>

    <rect x="15" y="56" width="100" height="24" rx="4" fill="#312E81"/>
    <text x="65" y="72" text-anchor="middle" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10">ΔV (Voltage)</text>

    <rect x="15" y="86" width="100" height="24" rx="4" fill="#312E81"/>
    <text x="65" y="102" text-anchor="middle" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10">Δf (Frequency)</text>

    <!-- PCC Switch -->
    <circle cx="65" cy="130" r="10" fill="#EF4444" stroke="#FCA5A5" stroke-width="1.5"/>
    <text x="65" y="133" text-anchor="middle" fill="#FFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700">PCC</text>
  </g>

  <!-- Output line to Grid & Campus Loads -->
  <path d="M 640 230 L 690 230" fill="none" stroke="#22D3EE" stroke-width="3"/>
  <path d="M 690 230 L 690 150 L 730 150" fill="none" stroke="#34D399" stroke-width="2.5"/>
  <path d="M 690 230 L 690 310 L 730 310" fill="none" stroke="#F87171" stroke-width="2.5"/>

  <!-- Endpoints -->
  <g transform="translate(680, 125)">
    <rect width="90" height="46" rx="6" fill="#14532D" stroke="#22C55E" stroke-width="1"/>
    <text x="45" y="24" text-anchor="middle" fill="#DCFCE7" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Local Loads</text>
    <text x="45" y="38" text-anchor="middle" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="9">Critical Bus</text>
  </g>

  <g transform="translate(680, 285)">
    <rect width="90" height="46" rx="6" fill="#7F1D1D" stroke="#EF4444" stroke-width="1"/>
    <text x="45" y="24" text-anchor="middle" fill="#FEE2E2" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Utility Grid</text>
    <text x="45" y="38" text-anchor="middle" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="9">11 kV / 415 V</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(40, 390)">
    <rect width="720" height="40" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="360" y="25" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">
      Seamless Grid-to-Island Transition &bull; Non-Detection Zone (NDZ) Analysis &bull; Voltage/Frequency Stability &bull; Peak Shaving
    </text>
  </g>
</svg>
